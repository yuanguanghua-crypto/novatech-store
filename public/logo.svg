<svg viewBox="0 0 200 56" xmlns="http://www.w3.org/2000/svg" width="200" height="56">
  <defs>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Icon background circle -->
  <circle cx="28" cy="28" r="26" fill="url(#bgGrad)" stroke="#0c2340" stroke-width="2"/>

  <!-- Globe grid lines -->
  <ellipse cx="28" cy="28" rx="14" ry="26" fill="none" stroke="#94a3b8" stroke-width="0.8" opacity="0.5"/>
  <line x1="14" y1="28" x2="42" y2="28" stroke="#94a3b8" stroke-width="0.8" opacity="0.5"/>
  <line x1="28" y1="2" x2="28" y2="54" stroke="#94a3b8" stroke-width="0.8" opacity="0.5"/>

  <!-- Flask body -->
  <path d="M22 10 L22 23 Q22 25.5 25 25.5 L31 25.5 Q34 25.5 34 23 L34 10" 
        fill="#e0f7fa" stroke="#0891b2" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Flask stopper -->
  <rect x="19" y="6.5" width="18" height="4" rx="2" fill="#0c2340"/>
  
  <!-- Flask bottom bulb -->
  <ellipse cx="28" cy="38" rx="11" ry="9.5" fill="#0891b2"/>
  
  <!-- Liquid -->
  <ellipse cx="28" cy="39" rx="9" ry="8" fill="#0ea5e9" opacity="0.85"/>
  
  <!-- Bubbles -->
  <circle cx="25" cy="33" r="1.8" fill="#7dd3fc" opacity="0.9"/>
  <circle cx="31" cy="31" r="1.3" fill="#7dd3fc" opacity="0.75"/>
  <circle cx="28" cy="29" r="0.9" fill="#7dd3fc" opacity="0.6"/>

  <!-- Globe accent dots -->
  <circle cx="28" cy="5" r="2.2" fill="#0c2340"/>
  <circle cx="40" cy="9" r="2.2" fill="#0891b2"/>
  <circle cx="47" cy="18" r="2.2" fill="#0c2340"/>
  <circle cx="47" cy="38" r="2.2" fill="#0891b2"/>
  <circle cx="40" cy="48" r="2.2" fill="#0c2340"/>

  <!-- Text: Lab -->
  <text x="62" y="26" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#0c2340" letter-spacing="-0.5">Lab</text>
  
  <!-- Text: Pro -->
  <text x="102" y="26" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#0891b2" letter-spacing="-0.5">Pro</text>
  
  <!-- Text: Global -->
  <text x="62" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#0c2340" letter-spacing="-0.5">Global</text>

  <!-- Subtitle line -->
  <line x1="62" y1="47" x2="198" y2="47" stroke="#0891b2" stroke-width="1.2" opacity="0.5"/>
  <text x="62" y="53" font-family="Arial, Helvetica, sans-serif" font-size="7.5" font-weight="600" fill="#64748b" letter-spacing="3.5">INDUSTRIAL LABORATORY EQUIPMENT</text>
</svg>
